<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Student Marks Lookup</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background: linear-gradient(to right, #6a11cb, #2575fc);
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 20px;
    }

    .container {
      background-color: white;
      padding: 40px;
      border-radius: 16px;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.1);
      width: 100%;
      max-width: 400px;
      text-align: center;
    }

    h1 {
      margin-bottom: 24px;
      color: #333;
    }

    input[type="text"] {
      width: 100%;
      padding: 12px 15px;
      margin-bottom: 20px;
      border: 2px solid #ddd;
      border-radius: 8px;
      font-size: 16px;
      transition: border-color 0.3s;
    }

    input[type="text"]:focus {
      border-color: #2575fc;
      outline: none;
    }

    button {
      padding: 12px 20px;
      font-size: 16px;
      background-color: #2575fc;
      color: white;
      border: none;
      border-radius: 8px;
      cursor: pointer;
      transition: background-color 0.3s ease;
    }

    button:hover {
      background-color: #1a5ed0;
    }

    .marks {
      margin-top: 24px;
      font-size: 18px;
      font-weight: bold;
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>Enter Enrollment Number</h1>
    <input type="text" id="enrollmentNumber" placeholder="Enter Enrollment Number" />
    <button onclick="getMarks()">Check Marks</button>
    <div class="marks" id="marksDisplay"></div>
  </div>

  <script>
    const studentMarks = {
      "230007001": 85,
      "230007002": 10,
      "230007003": 78,
      "230007004": 92,
      "230007005": 88,
      "230007006": 91,
      "230007007": 87,
      "230007008": 76,
      "230007009": 80,
      "230007010": 94,
      "230007011": 79,
      "230007012": 88,
      "230007013": 85,
      "230007014": 93,
      "230007015": 82,
      "230007016": 91,
      "230007017": 77,
      "230007018": 84,
      "230007019": 86,
      "230007020": 89,
      "230007021": 83,
      "230007022": 95,
      "230007023": 78,
      "230007024": 92,
      "230007025": 81,
      "230007026": 90,
      "230007027": 93,
      "230007028": 87,
      "230007029": 79,
      "230007030": 84,
      "230007031": 88,
      "230007032": 92,
      "230007033": 80,
      "230007034": 89,
      "230007035": 76,
      "230007036": 95
    };

    function getMarks() {
      const enrollmentNumber = document.getElementById("enrollmentNumber").value;
      const marksDisplay = document.getElementById("marksDisplay");

      if (studentMarks[enrollmentNumber]) {
        marksDisplay.textContent = `Marks: ${studentMarks[enrollmentNumber]}`;
        marksDisplay.style.color = "green";
      } else {
        marksDisplay.textContent = "Enrollment number not found!";
        marksDisplay.style.color = "red";
      }
    }
  </script>
</body>
</html>
