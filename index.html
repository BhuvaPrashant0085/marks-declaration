<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>Student Marks Lookup</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        body, html {
            height: 100%;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            overflow: hidden;
        }

        /* Video background */
        #background-video {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            object-fit: cover;
            z-index: -1;
        }

        .container {
            background-color: rgba(255, 255, 255, 0.9);
            padding: 40px;
            border-radius: 16px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.2);
            width: 100%;
            max-width: 400px;
            text-align: center;
            margin: 10% auto;
        }

        h1 {
            margin-bottom: 24px;
            color: #333;
        }

        input[type="text"] {
            width: 100%;
            padding: 12px 15px;
            margin-bottom: 20px;
            border: 2px solid #ddd;
            border-radius: 8px;
            font-size: 16px;
        }

        input[type="text"]:focus {
            border-color: #2575fc;
            outline: none;
        }

        button {
            padding: 12px 20px;
            font-size: 16px;
            background-color: #2575fc;
            color: white;
            border: none;
            border-radius: 8px;
            cursor: pointer;
        }

        button:hover {
            background-color: #1a5ed0;
        }

        .marks {
            margin-top: 24px;
            font-size: 18px;
            font-weight: bold;
        }
    </style>
</head>

    <div class="container">
        <h1>Enter Enrollment Number</h1>
        <input type="text" id="enrollmentNumber" placeholder="Enter Enrollment Number" />
        <button onclick="getMarks()">Check Marks</button>
        <div class="marks" id="marksDisplay"></div>
    </div>

  <script>
    // Updated student data with name, marks, and mobile
    const studentData = {
    "230007001": { name: "Anand", marks: 85, mobile: "9512340001" },
    "230007002": { name: "Prashant", marks: 80, mobile: "9512399064" }, // Your number
    "230007003": { name: "Abhishek", marks: 78, mobile: "9512340003" },
    "230007004": { name: "Heer", marks: 92, mobile: "9512340004" },
    "230007005": { name: "Aman", marks: 88, mobile: "9512340005" },
    "230007006": { name: "Bonisha", marks: 91, mobile: "9512340006" },
    "230007007": { name: "Dhruvi", marks: 99, mobile: "9512340007" },
    // Add more if needed...
};


    function getMarks() {
    const enrollmentNumber = document.getElementById("enrollmentNumber").value.trim();
    const marksDisplay = document.getElementById("marksDisplay");

    if (studentData[enrollmentNumber]) {
        const { name, marks, mobile } = studentData[enrollmentNumber];
        marksDisplay.innerHTML = `
            <p><strong>Name:</strong> ${name}</p>
            <p><strong>Marks:</strong> ${marks}</p>
            <p><strong>Mobile:</strong> ${mobile}</p>
        `;
        marksDisplay.style.color = "green";
    } else {
        marksDisplay.textContent = "Enrollment number not found!";
        marksDisplay.style.color = "red";
    }
}

</script>
